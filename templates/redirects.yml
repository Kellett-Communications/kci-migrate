id: MODULE_NAME_redirects
label: MODULE_NAME path redirects.
migration_tags:
  - Drupal 7
  - Path Redirect
  - Content
source:
  plugin: d7_path_redirect
  track_changes: true
  constants:
    uid_root: 1
    redirect_prefix: 'internal:/node/'
process:
  rid: rid
  uid:
    - plugin: migration_lookup
      migration: MODULE_NAME_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: constants/uid_root
  redirect_source/path: source
  redirect_source/query:
    plugin: d7_redirect_source_query
    source: source_options

  pseudo_source_nid:
    -
      plugin: explode
      source: redirect
      delimiter: /

  pseudo_nid_lookup:
    - plugin: migration_lookup
      source: '@pseudo_source_nid/1'
      migration:
        # UPDATE THESE with your node migrations.
        - MODULE_NAME_node_NODE_TYPE
      no_stub: true
    - plugin: skip_on_empty
      method: row

  pseudo_redirect_uri:
    - plugin: single_value
      source: '@pseudo_nid_lookup'
    - plugin: skip_on_empty
      method: process
    - plugin: concat
      delimiter: /
      source:
        - '@pseudo_source_nid/0'
        - '@pseudo_nid_lookup'

  redirect_redirect/uri:
    - plugin: d7_path_redirect
      source:
        - '@pseudo_redirect_uri'
        - redirect_options
    - plugin: skip_on_empty
      method: row
      # Ignore disabled redirects.
    - plugin: skip_on_value
      method: row
      not_equals: true
      value: 1
      source: status

  language:
    - plugin: default_value
      source: language
      default_value: und
    - plugin: language_und_to_en
  status_code: status_code
destination:
  plugin: entity:redirect
migration_dependencies:
  required:
    # UPDATE THESE with your node migrations.
    - MODULE_NAME_node_NODE_TYPE
