id: MODULE_NAME_redirect_aliases
label: MODULE_NAME redirect old aliases to new nodes.
migration_tags:
  - Drupal 7
  - Path Redirect
  - Content
migration_group: legacy
source:
  plugin: d7_url_alias
  track_changes: true
  constants:
    uid_root: 1
process:
  # Skip aliases that are not for nodes.
  pseudo_skip_on_not_contains_node:
    plugin: skip_on_condition
    method: row
    source: source
    condition:
      plugin: not:contains
      value: 'node/'

  # Skip aliases that already exist as aliases or redirects.
  pseudo_skip_on_exists:
    # We need a leading slash to match the destination value.
    # Now we can go back to the original with no slashes.
    -
      plugin: concat
      delimiter: /
      source:
        - ''
        - alias
    # Skip aliases that already exist.
    -
      plugin: skip_on_match
      entity_type: path_alias
      method: row
      target: alias
    # Skip aliases that are already redirects.
    -
      plugin: skip_on_match
      entity_type: redirect
      method: row
      target: redirect_source__path

  uid:
    plugin: default_value
    default_value: 1
  language:
    - plugin: default_value
      source: language
      default_value: und
    - plugin: language_und_to_en
  status_code:
    plugin: default_value
    default_value: 301

  redirect_source/path: alias

  pseudo_source_nid:
    -
      plugin: explode
      source: source
      delimiter: /

  pseudo_nid_lookup:
    - plugin: migration_lookup
      source: '@pseudo_source_nid/1'
      migration:
        # UPDATE THESE with your node migrations.
        - MODULE_NAME_node_NODE_TYPE
      no_stub: true
    - plugin: skip_on_empty
      method: row

  pseudo_redirect_uri:
    - plugin: single_value
      source: '@pseudo_nid_lookup'
    - plugin: skip_on_empty
      method: process
    - plugin: concat
      delimiter: /
      source:
        - '@pseudo_source_nid/0'
        - '@pseudo_nid_lookup'

  redirect_redirect/uri:
    - plugin: d7_path_redirect
      source:
        - '@pseudo_redirect_uri'
    - plugin: skip_on_empty
      method: row

destination:
  plugin: entity:redirect
migration_dependencies:
  required:
    # UPDATE THESE with your node migrations.
    - MODULE_NAME_node_NODE_TYPE
