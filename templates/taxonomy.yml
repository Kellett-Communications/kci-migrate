id: MODULE_NAME_ENTITY_TYPE_DESTINATION_BUNDLE
label: MODULE_NAME DESTINATION_BUNDLE taxonomy terms
migration_group: legacy
migration_tags:
  - Drupal 7
  - Content
  - taxonomy
source:
  plugin: d7_taxonomy_term
  bundle: SOURCE_BUNDLE
  translation: false
  track_changes: true
  constants:
    default_text_format: rich_text
    uid_root: 1
process:
  uid:
    - plugin: migration_lookup
      migration: MODULE_NAME_users
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: constants/uid_root
  langcode:
    - plugin: default_value
      source: language
      default_value: "en"
    - plugin: language_und_to_en
  name: name
  description/value: description
  description/format: constants/default_text_format
  weight: weight
  parent:
    -
      plugin: skip_on_empty
      source: parent
      method: process
    -
      plugin: migration_lookup
      migration: MODULE_NAME_DESTINATION_BUNDLE

destination:
  plugin: entity:taxonomy_term
  default_bundle: DESTINATION_BUNDLE
migration_dependencies:
  required:
    - MODULE_NAME_users
