id: MODULE_NAME_ENTITY_TYPE
label: MODULE_NAME Public files
migration_tags:
  - Drupal 7
  - Content
  - Files
  - Media
migration_group: legacy
source:
  plugin: d7_file
  scheme: public
  batch_size: 200
  track_changes: true
  constants:
    uid_root: 1
    # You can also use "public://d7", but then you have to actually copy
    # all the files into the d7 directory. By using a file path, you can
    # just symlink d7/sites/[default]/files directory to the actual source
    # files directory.
    source_base_path: 'sites/default/files/d7'
process:
  filename: filename
  source_full_path:
    -
      plugin: concat
      delimiter: /
      source:
        - constants/source_base_path
        - filepath
  uri:
    plugin: file_copy
    file_exists: 'use existing'
    source:
      - '@source_full_path'
      - uri
  filemime: filemime
  filesize: filesize
  status: status
  created: timestamp
  changed: timestamp
  langcode:
    - plugin: default_value
      source: language
      default_value: "en"
    - plugin: language_und_to_en
  uid:
    - plugin: migration_lookup
      migration: MODULE_NAME_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: constants/uid_root

destination:
  plugin: entity:file
migration_dependencies:
  required:
    - MODULE_NAME_users
