id: MODULE_NAME_ENTITY_TYPE
label: MODULE_NAME Menu links
audit: true
migration_tags:
  - Drupal 7
  - Content
migration_group: legacy
source:
  plugin: menu_link
  constants:
    bundle: menu_link_content
    default_menu: main
process:
  skip_translation:
    plugin: skip_on_empty
    method: row
    source: skip_translation
  id: mlid
  langcode:
    plugin: default_value
    source: language
    default_value: und
  bundle: 'constants/bundle'
  title: link_title
  description: description
  menu_name:
    -
      plugin: skip_on_empty
      source: menu_name
      method: row
    -
      plugin: default_value
      default_value: 'constants/default_menu'

  link/uri:
    - plugin: kci_migrate_links
      source: link_path
    - plugin: static_map
      bypass: true
      map:
        '<nolink>': 'route:<button>'
    - plugin: link_uri
      validate_route: false

  link/options: options
  route:
    plugin: route
    source:
      - link_path
      - options
  route_name: '@route/route_name'
  route_parameters: '@route/route_parameters'
  url: '@route/url'
  options: '@route/options'
  external: external
  weight: weight
  expanded: expanded
  enabled: enabled
  parent:
    plugin: menu_link_parent
    source:
      - plid
      - '@menu_name'
      - parent_link_path
  changed: updated
destination:
  plugin: entity:menu_link_content
  no_stub: true
migration_dependencies:
  required:
    # Update this to include any additional node bundles that might be linked from the menu.
    - MODULE_NAME_node_page
